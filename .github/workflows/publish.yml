name: Publish to npm

on:
  push:
    tags:
      - 'host-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
        working-directory: ./host
      - run: npm publish --access public
        working-directory: ./host
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
